# ankinote web GUI, talking to an AnkiConnect you already run (the Anki desktop
# app on the host, or one elsewhere).
#
#   cd deploy/standard
#   cp .env.example .env      # optional: AnkiConnect URL, port, image tag
#   docker compose up -d      # http://localhost:8080
#
# In the AnkiConnect add-on config set "webBindAddress": "0.0.0.0" and add the
# container origin to "webCorsOriginList" (or use "*"), then restart Anki.
#
# For a self-contained stack with no Anki desktop app, use ../headless instead.

services:
  ankinote:
    image: ${ANKINOTE_IMAGE:-ghcr.io/ignity21/ankinote-ai:latest}
    # Build from a PyPI release instead of pulling:
    #   ANKINOTE_VERSION=0.3.1 docker compose build
    # build:
    #   context: ../..
    #   args:
    #     ANKINOTE_VERSION: ${ANKINOTE_VERSION:?set ANKINOTE_VERSION}
    ports:
      # Change the published address/port via ANKINOTE_PUBLISH in .env, e.g.
      # "8080" (all interfaces) or "127.0.0.1:9000".
      - "${ANKINOTE_PUBLISH:-127.0.0.1:8080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      ANKI_CONNECT_URL: ${ANKI_CONNECT_URL:-http://host.docker.internal:8765}
      ANKINOTE_STORAGE_SECRET: ${ANKINOTE_STORAGE_SECRET:-}
    extra_hosts:
      # Lets the container reach the host on Linux too (Docker Desktop provides
      # host.docker.internal natively).
      - "host.docker.internal:host-gateway"
    volumes:
      # Provider profiles and API keys entered on the Settings page.
      - ankinote-config:/config
    restart: unless-stopped

volumes:
  ankinote-config:
