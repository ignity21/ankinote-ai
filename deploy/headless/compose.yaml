# Self-contained ankinote stack: the web GUI with the in-process Anki collection
# backend. No Anki desktop app and no AnkiConnect — the GUI keeps its own
# collection in the anki-data volume and syncs it straight with AnkiWeb.
#
#   cd deploy/headless
#   cp .env.example .env             # optional: AnkiWeb login, port, image tag
#   docker compose up -d             # http://localhost:8080
#
# ANKIWEB_USERNAME / ANKIWEB_PASSWORD are optional: leave them blank and log in
# from the Settings page instead. A brand-new collection cannot save cards until
# its first AnkiWeb sync finishes.

services:
  ankinote:
    image: ${ANKINOTE_IMAGE:-ghcr.io/ignity21/ankinote-ai:latest}
    # Build from a PyPI release instead of pulling:
    #   ANKINOTE_VERSION=0.3.1 docker compose build
    # build:
    #   context: ../..
    #   args:
    #     ANKINOTE_VERSION: ${ANKINOTE_VERSION:?set ANKINOTE_VERSION}
    ports:
      # Change the published address/port via ANKINOTE_PUBLISH in .env, e.g.
      # "8080" (all interfaces) or "127.0.0.1:9000".
      - "${ANKINOTE_PUBLISH:-127.0.0.1:8080}:8080"
    env_file:
      # ANKIWEB_USERNAME / ANKIWEB_PASSWORD are read from here when present.
      - path: .env
        required: false
    environment:
      ANKI_BACKEND: collection
      ANKI_COLLECTION_PATH: /data/collection.anki2
      ANKINOTE_STORAGE_SECRET: ${ANKINOTE_STORAGE_SECRET:-}
    volumes:
      # Provider profiles and API keys entered on the Settings page.
      - ankinote-config:/config
      # The Anki collection, media, sync state, and pre-full-sync backups.
      # Or bring your own collection directory instead of the named volume:
      #   - ./anki-data:/data
      - anki-data:/data
    restart: unless-stopped

volumes:
  ankinote-config:
  anki-data:
