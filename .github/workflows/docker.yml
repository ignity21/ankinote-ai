name: Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Published PyPI version to build (e.g. 0.3.1)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          raw="${{ github.event.inputs.version || github.event.release.tag_name }}"
          echo "version=${raw#v}" >> "$GITHUB_OUTPUT"

      - name: Wait for PyPI release
        run: |
          version="${{ steps.v.outputs.version }}"
          # Probe the simple index (what pip actually reads) rather than the JSON
          # API, which can return 200 before the simple index catches up.
          url="https://pypi.org/simple/ankinote-ai/"
          needle="ankinote_ai-${version}-py3-none-any.whl"
          for i in $(seq 1 30); do
            if curl -s "$url" | grep -qF "$needle"; then
              echo "ankinote-ai==${version} is on PyPI"
              exit 0
            fi
            echo "attempt $i: ankinote-ai==${version} not yet on PyPI simple index, retrying in 10s"
            sleep 10
          done
          echo "ankinote-ai==${version} did not appear on PyPI in time" >&2
          exit 1

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/ignity21/ankinote-ai
            docker.io/ignity21/ankinote-ai
          tags: |
            type=semver,pattern={{version}},value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ANKINOTE_VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
