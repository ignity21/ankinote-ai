[project]
name = "ankinote-ai"
dynamic = ["version"]
description = "AI-powered Anki card generator for vocabulary, phrases, sentences, and STEM concepts, powered by litellm"
requires-python = ">=3.13"
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "Chris Chen", email = "chrischen@ignity.xyz" }
]
keywords = ["anki", "flashcards", "vocabulary", "ai", "google-ai", "language-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.28.0",
    "asynciolimiter>=1.2.0",
    "click>=8.2.0",
    "google-cloud-texttospeech>=2.31.0",
    "litellm>=1.81.9",
    "loguru>=0.7.3",
    "nicegui>=2.14.0",
    "pillow>=12.1.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.1",
    "shortuuid>=1.0.13",
]

[project.scripts]
ankinote = "ankinote.cli.main:main"
ankinote-gui = "ankinote.ui.main:start_gui"

[project.urls]
Homepage = "https://github.com/ignity21/ankinote-ai"
Repository = "https://github.com/ignity21/ankinote-ai"
Documentation = "https://github.com/ignity21/ankinote-ai"

[tool.hatch.version]
path = "src/ankinote/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ankinote"]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "rich>=14.1.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.pyright]
include = ["src/ankinote"]
exclude = [
    ".ruff_cache",
    "**/__pycache__",
]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
minversion = "8.4.1"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:litellm\\.litellm_core_utils\\.logging_utils",
]
