<section class="stage-card spelling-card">
  <div class="eyebrow">Spelling{{#target_language}} · {{target_language}}{{/target_language}}</div>
  {{#core_meaning}}<div class="meaning-prompt">{{core_meaning}}</div>{{/core_meaning}}
  {{#headword_audio}}
  <div class="audio-hint">
    <span class="audio-hint-label">Pronunciation hint</span>
    <span class="inline-audio">{{headword_audio}}</span>
  </div>
  {{/headword_audio}}
  <div class="type-area">{{type:lemma}}</div>
</section>
