<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Ankinote AI logo</title>
  <desc id="desc">A blue-green memory orbit looping around two rounded flashcards.</desc>
  <defs>
    <linearGradient id="backCard" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0754B8"/>
      <stop offset="0.48" stop-color="#159DE0"/>
      <stop offset="1" stop-color="#46E1C0"/>
    </linearGradient>
    <linearGradient id="frontCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FCFF"/>
      <stop offset="0.55" stop-color="#E8F8FF"/>
      <stop offset="1" stop-color="#CDEEFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#41DEC7"/>
      <stop offset="0.42" stop-color="#128FDB"/>
      <stop offset="0.72" stop-color="#0872CC"/>
      <stop offset="1" stop-color="#36DDB3"/>
    </linearGradient>
    <linearGradient id="memoryDot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0879C8"/>
      <stop offset="1" stop-color="#44E0B8"/>
    </linearGradient>
    <linearGradient id="detail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9DCDF1"/>
      <stop offset="1" stop-color="#B6DCF5"/>
    </linearGradient>
  </defs>

  <!-- Secondary card: the first encounter with a piece of knowledge. -->
  <rect x="302" y="203" width="410" height="604" rx="70"
        transform="rotate(-9 507 505)" fill="url(#backCard)"/>

  <!-- Rear half of the repetition orbit. -->
  <path d="M183 595 C103 531 165 443 314 369 C483 285 711 251 823 288 C929 324 907 434 813 544 C780 590 750 620 720 650"
        fill="none" stroke="url(#orbit)" stroke-width="54" stroke-linecap="round"/>

  <!-- Current card: intentionally clean so the symbol remains legible at icon size. -->
  <rect x="332" y="258" width="430" height="568" rx="70"
        transform="rotate(5 547 542)" fill="url(#frontCard)"/>

  <!-- Front half of the orbit, returning into the card. -->
  <path d="M183 595 C274 665 443 599 584 510 C654 466 706 425 738 390"
        fill="none" stroke="url(#orbit)" stroke-width="54" stroke-linecap="round"/>

  <!-- Retained memory. -->
  <circle cx="742" cy="385" r="43" fill="url(#memoryDot)"/>

  <!-- Minimal note cues; removed in the micro-size variant. -->
  <g fill="none" stroke="url(#detail)" stroke-width="25" stroke-linecap="round"
     transform="rotate(5 547 542)">
    <path d="M449 674 H643"/>
    <path d="M449 739 H584"/>
  </g>
</svg>
